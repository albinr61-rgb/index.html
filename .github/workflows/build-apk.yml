name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup app
        run: |
          mkdir -p www && cp index.html www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          echo '{"appId":"com.fabcalc.app","appName":"Fab Calc","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fab-calc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
