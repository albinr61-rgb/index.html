<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Measurement Tool</title>
  
  <!-- Scale Icon (SVG Data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><path d='M20 70 L80 70 L80 40 L20 40 Z' fill='%23ffffff'/><line x1='30' y1='40' x2='30' y2='52' stroke='%232563eb' stroke-width='3'/><line x1='40' y1='40' x2='40' y2='60' stroke='%232563eb' stroke-width='4'/><line x1='50' y1='40' x2='50' y2='52' stroke='%232563eb' stroke-width='3'/><line x1='60' y1='40' x2='60' y2='60' stroke='%232563eb' stroke-width='4'/><line x1='70' y1='40' x2='70' y2='52' stroke='%232563eb' stroke-width='3'/></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: #1e293b; border-radius: 18px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }

    /* Header */
    .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .header svg { width: 32px; height: 32px; }
    .header h1 { font-size: 19px; color: #38bdf8; font-weight: 700; }

    /* Main Navigation */
    .main-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }
    .nav-btn { background: #334155; color: #94a3b8; border: none; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .nav-btn.active { background: #0284c7; color: #fff; }

    /* Sub Tabs */
    .shape-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 15px; }
    .s-btn { background: #1e293b; border: 1px solid #475569; color: #cbd5e1; padding: 8px 4px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .s-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: bold; }

    .tool-page, .shape-calc { display: none; }
    .tool-page.active, .shape-calc.active { display: block; }

    /* Form Inputs */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    .input-row { display: flex; gap: 6px; }
    input, select { padding: 10px; border-radius: 8px; border: 1.5px solid #475569; background: #0f172a; color: white; font-size: 15px; outline: none; }
    input { flex: 1; }
    select { width: 85px; }
    input:focus, select:focus { border-color: #38bdf8; }

    button.action-btn { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 5px; cursor: pointer; }
    button.action-btn:active { background: #0369a1; }

    /* Results */
    .res-card { margin-top: 15px; background: #0f172a; border-radius: 10px; padding: 12px; border: 1px solid #334155; }
    .res-title { font-size: 13px; color: #38bdf8; margin-bottom: 8px; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .res-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #e2e8f0; }
    .res-val { font-weight: bold; color: #4ade80; }

    /* Spirit Level */
    .level-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; }
    .bullseye { width: 220px; height: 220px; border-radius: 50%; background: #0f172a; border: 4px solid #38bdf8; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); }
    .crosshair-h { position: absolute; width: 100%; height: 1px; background: rgba(56, 189, 248, 0.4); }
    .crosshair-v { position: absolute; height: 100%; width: 1px; background: rgba(56, 189, 248, 0.4); }
    .target-ring { width: 60px; height: 60px; border-radius: 50%; border: 2px dashed #4ade80; position: absolute; }
    .bubble { width: 34px; height: 34px; border-radius: 50%; background: #ef4444; position: absolute; transition: transform 0.05s ease-out; box-shadow: 0 0 10px rgba(239,68,68,0.8); }
    .bubble.level { background: #22c55e !important; box-shadow: 0 0 15px rgba(34,197,94,0.9) !important; }
    .level-readings { margin-top: 15px; font-size: 16px; font-weight: bold; }

    /* Camera Scale */
    .cam-box { position: relative; width: 100%; height: 380px; background: #000; border-radius: 12px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .cam-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .scale-ticks { position: absolute; left: 0; top: 0; width: 45px; height: 100%; border-right: 2px solid #ef4444; background: rgba(0,0,0,0.25); display: flex; flex-direction: column; justify-content: space-between; padding: 5px 0; color: #fff; font-size: 10px; font-weight: bold; }
    .cam-ctrls { display: flex; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Header with Ruler SVG -->
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
      <path d="M21.3 8.7 8.7 21.3c-1 1-2.5 1-3.4 0l-2.6-2.6c-1-1-1-2.5 0-3.4L15.3 2.7c1-1 2.5-1 3.4 0l2.6 2.6c1 1 1 2.5 0 3.4Z"/>
      <path d="m7.5 10.5 2 2"/><path d="m10.5 7.5 2 2"/><path d="m13.5 4.5 2 2"/><path d="m4.5 13.5 2 2"/>
    </svg>
    <h1>MEASURE MASTER</h1>
  </div>

  <!-- Main 3 Navigation Tabs -->
  <div class="main-nav">
    <button class="nav-btn active" onclick="switchTool('calcTool')">📐 கணக்கீடு</button>
    <button class="nav-btn" onclick="switchTool('levelTool')">🟢 மட்டம் (Level)</button>
    <button class="nav-btn" onclick="switchTool('camTool')">📷 கேமரா ஸ்கேல்</button>
  </div>

  <!-- TOOL 1: CALCULATOR -->
  <div id="calcTool" class="tool-page active">
    <div class="shape-tabs">
      <button class="s-btn active" onclick="switchShape('s90')">90° செங்கோணம்</button>
      <button class="s-btn" onclick="switchShape('s45')">45° சாய்வு</button>
      <button class="s-btn" onclick="switchShape('sRound')">Round வட்டம்</button>
      <button class="s-btn" onclick="switchShape('sSquare')">Square சதுரம்</button>
    </div>

    <!-- 90 Deg -->
    <div id="s90" class="shape-calc active">
      <div class="form-group">
        <label>அடி மட்டம் (Base A):</label>
        <div class="input-row">
          <input type="number" id="base90" placeholder="அளவு">
          <select id="uBase90"><option value="feet">Feet</option><option value="inch">Inch</option><option value="mm">mm</option><option value="cm">cm</option><option value="m">meter</option></select>
        </div>
      </div>
      <div class="form-group">
        <label>செங்குத்து உயரம் (Height B):</label>
        <div class="input-row">
          <input type="number" id="h90" placeholder="அளவு">
          <select id="uH90"><option value="feet">Feet</option><option value="inch">Inch</option><option value="mm">mm</option><option value="cm">cm</option><option value="m">meter</option></select>
        </div>
      </div>
      <button class="action-btn" onclick="run90()">கணக்கிடு (90°)</button>
    </div>

    <!-- 45 Deg -->
    <div id="s45" class="shape-calc">
      <div class="form-group">
        <label>பக்க அளவு (Side / Offset):</label>
        <div class="input-row">
          <input type="number" id="side45" placeholder="அளவு">
          <select id="u45"><option value="feet">Feet</option><option value="inch">Inch</option><option value="mm">mm</option><option value="cm">cm</option><option value="m">meter</option></select>
        </div>
      </div>
      <button class="action-btn" onclick="run45()">கணக்கிடு (45°)</button>
    </div>

    <!-- Round -->
    <div id="sRound" class="shape-calc">
      <div class="form-group">
        <label>விட்டம் / Diameter (முழு அகலம்):</label>
        <div class="input-row">
          <input type="number" id="diaR" placeholder="Diameter">
          <select id="uDia"><option value="feet">Feet</option><option value="inch">Inch</option><option value="mm">mm</option><option value="cm">cm</option><option value="m">meter</option></select>
        </div>
      </div>
      <button class="action-btn" onclick="runRound()">கணக்கிடு (வட்டம்)</button>
    </div>

    <!-- Square -->
    <div id="sSquare" class="shape-calc">
      <div class="form-group">
        <label>சதுரத்தின் ஒரு பக்கம் (Side):</label>
        <div class="input-row">
          <input type="number" id="sideSq" placeholder="அளவு">
          <select id="uSq"><option value="feet">Feet</option><option value="inch">Inch</option><option value="mm">mm</option><option value="cm">cm</option><option value="m">meter</option></select>
        </div>
      </div>
      <button class="action-btn" onclick="runSquare()">கணக்கிடு (சதுரம்)</button>
    </div>

    <!-- Multi-Unit Result Card -->
    <div id="resultCard" class="res-card" style="display:none;">
      <div class="res-title">📐 துல்லியமான முடிவுகள் (ALL UNITS):</div>
      <div id="resBody"></div>
    </div>
  </div>

  <!-- TOOL 2: SPIRIT LEVEL -->
  <div id="levelTool" class="tool-page">
    <div class="level-container">
      <div class="bullseye">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
        <div class="target-ring"></div>
        <div class="bubble" id="levelBubble"></div>
      </div>
      <div class="level-readings" id="levelRead">X: 0.0° | Y: 0.0°</div>
      <p style="color:#64748b; font-size:12px; margin-top:8px;">(பச்சை நிறம் வந்தால் சரியான மட்டம்)</p>
      <button class="action-btn" style="margin-top:15px; width:auto; padding:8px 20px;" onclick="requestSensors()">Start Level Sensor</button>
    </div>
  </div>

  <!-- TOOL 3: CAMERA SCALE -->
  <div id="camTool" class="tool-page">
    <div class="cam-box">
      <video id="videoFeed" playsinline autoplay></video>
      <div class="cam-overlay">
        <!-- Scale Bar on Screen -->
        <div class="scale-ticks">
          <span>10cm</span><span>9cm</span><span>8cm</span><span>7cm</span><span>6cm</span><span>5cm</span><span>4cm</span><span>3cm</span><span>2cm</span><span>1cm</span><span>0</span>
        </div>
        <!-- Alignment crosshair in center -->
        <div style="position:absolute; top:50%; left:0; width:100%; height:1px; background:rgba(34,197,94,0.6);"></div>
        <div style="position:absolute; left:50%; top:0; width:1px; height:100%; background:rgba(34,197,94,0.6);"></div>
      </div>
    </div>
    <div class="cam-ctrls">
      <button class="action-btn" onclick="startCamera()">📷 கேமரா Start</button>
      <button class="action-btn" style="background:#dc2626;" onclick="stopCamera()">Stop</button>
    </div>
  </div>

</div>

<script>
  // Navigation Tabs
  function switchTool(id) {
    document.querySelectorAll('.tool-page').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
    if(id !== 'camTool') stopCamera();
  }

  function switchShape(id) {
    document.querySelectorAll('.shape-calc').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.s-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
    document.getElementById('resultCard').style.display = 'none';
  }

  // UNIT CONVERSION ENGINE (Base = Millimeters)
  const toMM = { 'mm': 1, 'cm': 10, 'm': 1000, 'inch': 25.4, 'feet': 304.8 };

  function renderOutput(lengthMM, areaMM2 = null) {
    let card = document.getElementById('resultCard');
    let body = document.getElementById('resBody');
    body.innerHTML = '';

    if (lengthMM !== null) {
      let ft = lengthMM / toMM.feet;
      let inc = lengthMM / toMM.inch;
      let mm = lengthMM;
      let cm = lengthMM / toMM.cm;
      let m = lengthMM / toMM.m;

      body.innerHTML += `
        <div class="res-item"><span>நீளம் (Feet):</span><span class="res-val">${ft.toFixed(3)} ft (${Math.floor(ft)}' ${(inc%12).toFixed(1)}")</span></div>
        <div class="res-item"><span>நீளம் (Inches):</span><span class="res-val">${inc.toFixed(2)} in</span></div>
        <div class="res-item"><span>நீளம் (mm):</span><span class="res-val">${mm.toFixed(1)} mm</span></div>
        <div class="res-item"><span>நீளம் (cm):</span><span class="res-val">${cm.toFixed(1)} cm</span></div>
        <div class="res-item"><span>நீளம் (Meter):</span><span class="res-val">${m.toFixed(3)} m</span></div>
      `;
    }

    if (areaMM2 !== null) {
      let sqFt = areaMM2 / (304.8 * 304.8);
      let sqM = areaMM2 / (1000 * 1000);
      let sqInc = areaMM2 / (25.4 * 25.4);
      let sqCm = areaMM2 / 100;

      body.innerHTML += `
        <div style="margin:8px 0; border-top:1px dashed #334155;"></div>
        <div class="res-item"><span>பரப்பளவு (Sq Feet):</span><span class="res-val">${sqFt.toFixed(3)} sq.ft</span></div>
        <div class="res-item"><span>பரப்பளவு (Sq Meter):</span><span class="res-val">${sqM.toFixed(3)} sq.m</span></div>
        <div class="res-item"><span>பரப்பளவு (Sq Inch):</span><span class="res-val">${sqInc.toFixed(2)} sq.in</span></div>
        <div class="res-item"><span>பரப்பளவு (Sq cm):</span><span class="res-val">${sqCm.toFixed(1)} sq.cm</span></div>
      `;
    }
    card.style.display = 'block';
  }

  // 1. 90 Deg Calculation
  function run90() {
    let b = parseFloat(document.getElementById('base90').value);
    let h = parseFloat(document.getElementById('h90').value);
    let ub = document.getElementById('uBase90').value;
    let uh = document.getElementById('uH90').value;
    if(!b || !h) return alert('அளவுகளை உள்ளிடவும்');

    let bMM = b * toMM[ub];
    let hMM = h * toMM[uh];
    let diagMM = Math.sqrt((bMM * bMM) + (hMM * hMM));
    let areaMM2 = 0.5 * bMM * hMM;
    renderOutput(diagMM, areaMM2);
  }

  // 2. 45 Deg Calculation
  function run45() {
    let s = parseFloat(document.getElementById('side45').value);
    let u = document.getElementById('u45').value;
    if(!s) return alert('அளவை உள்ளிடவும்');

    let sMM = s * toMM[u];
    let travelMM = sMM * 1.41421356;
    renderOutput(travelMM, null);
  }

  // 3. Round
  function runRound() {
    let d = parseFloat(document.getElementById('diaR').value);
    let u = document.getElementById('uDia').value;
    if(!d) return alert('விட்டம் உள்ளிடவும்');

    let dMM = d * toMM[u];
    let rMM = dMM / 2;
    let circMM = Math.PI * dMM;
    let areaMM2 = Math.PI * rMM * rMM;
    renderOutput(circMM, areaMM2);
  }

  // 4. Square
  function runSquare() {
    let s = parseFloat(document.getElementById('sideSq').value);
    let u = document.getElementById('uSq').value;
    if(!s) return alert('அளவை உள்ளிடவும்');

    let sMM = s * toMM[u];
    let diagMM = sMM * 1.41421356;
    let areaMM2 = sMM * sMM;
    renderOutput(diagMM, areaMM2);
  }

  // TOOL 2: SPIRIT LEVEL ENGINE (Orientation API)
  function requestSensors() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
      });
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }
  }

  function handleOrientation(e) {
    let x = e.gamma || 0; // Left-Right [-90, 90]
    let y = e.beta || 0;  // Front-Back [-180, 180]

    let maxMove = 90;
    let posX = Math.max(-maxMove, Math.min(maxMove, x * 2));
    let posY = Math.max(-maxMove, Math.min(maxMove, y * 2));

    let bubble = document.getElementById('levelBubble');
    bubble.style.transform = `translate(${posX}px, ${posY}px)`;

    let isLevel = Math.abs(x) < 1.0 && Math.abs(y) < 1.0;
    if (isLevel) {
      bubble.classList.add('level');
    } else {
      bubble.classList.remove('level');
    }

    document.getElementById('levelRead').innerText = `X: ${x.toFixed(1)}° | Y: ${y.toFixed(1)}°`;
  }

  // TOOL 3: CAMERA STREAM ENGINE
  let streamRef = null;
  async function startCamera() {
    try {
      const constraints = { video: { facingMode: { ideal: "environment" } } };
      streamRef = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('videoFeed').srcObject = streamRef;
    } catch (err) {
      alert("கேமரா அனுமதி கிடைக்கவில்லை: " + err.message);
    }
  }

  function stopCamera() {
    if (streamRef) {
      streamRef.getTracks().forEach(t => t.stop());
      streamRef = null;
    }
  }
</script>

</body>
</html>
